[versions]
agp                  = "8.9.0"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.28"
hilt                 = "2.51.1"
compose-bom          = "2024.09.03"
navigation-compose   = "2.8.3"
hilt-navigation      = "1.2.0"
lifecycle            = "2.8.6"
activity-compose     = "1.9.3"
core-ktx             = "1.13.1"
firebase-bom         = "33.5.1"
datastore            = "1.1.1"
security-crypto      = "1.1.0-alpha06"
coroutines           = "1.9.0"
kotlinx-serialization = "1.7.3"
junit                = "4.13.2"
coroutines-test      = "1.9.0"
material             = "1.12.0"

[libraries]
androidx-core-ktx                       = { group = "androidx.core",                   name = "core-ktx",                          version.ref = "core-ktx" }
androidx-activity-compose               = { group = "androidx.activity",               name = "activity-compose",                  version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose      = { group = "androidx.lifecycle",              name = "lifecycle-runtime-compose",         version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",              name = "lifecycle-viewmodel-compose",       version.ref = "lifecycle" }
androidx-navigation-compose             = { group = "androidx.navigation",             name = "navigation-compose",                version.ref = "navigation-compose" }
androidx-compose-bom                    = { group = "androidx.compose",               name = "compose-bom",                       version.ref = "compose-bom" }
androidx-compose-ui                     = { group = "androidx.compose.ui",            name = "ui" }
androidx-compose-ui-graphics            = { group = "androidx.compose.ui",            name = "ui-graphics" }
androidx-compose-ui-tooling-preview     = { group = "androidx.compose.ui",            name = "ui-tooling-preview" }
androidx-compose-ui-tooling             = { group = "androidx.compose.ui",            name = "ui-tooling" }
androidx-compose-material3              = { group = "androidx.compose.material3",     name = "material3" }
androidx-compose-material-icons         = { group = "androidx.compose.material",      name = "material-icons-extended" }
androidx-datastore-preferences          = { group = "androidx.datastore",             name = "datastore-preferences",             version.ref = "datastore" }
androidx-security-crypto                = { group = "androidx.security",              name = "security-crypto",                   version.ref = "security-crypto" }
firebase-bom                            = { group = "com.google.firebase",            name = "firebase-bom",                      version.ref = "firebase-bom" }
firebase-database                       = { group = "com.google.firebase",            name = "firebase-database-ktx" }
firebase-auth                           = { group = "com.google.firebase",            name = "firebase-auth-ktx" }
firebase-firestore                      = { group = "com.google.firebase",            name = "firebase-firestore" }
hilt-android                            = { group = "com.google.dagger",              name = "hilt-android",                      version.ref = "hilt" }
hilt-compiler                           = { group = "com.google.dagger",              name = "hilt-android-compiler",             version.ref = "hilt" }
androidx-hilt-navigation-compose        = { group = "androidx.hilt",                 name = "hilt-navigation-compose",           version.ref = "hilt-navigation" }
kotlinx-coroutines-android              = { group = "org.jetbrains.kotlinx",          name = "kotlinx-coroutines-android",        version.ref = "coroutines" }
kotlinx-coroutines-play-services        = { group = "org.jetbrains.kotlinx",          name = "kotlinx-coroutines-play-services",  version.ref = "coroutines" }
junit                                   = { group = "junit",                          name = "junit",                             version.ref = "junit" }
kotlinx-coroutines-test                 = { group = "org.jetbrains.kotlinx",          name = "kotlinx-coroutines-test",           version.ref = "coroutines-test" }
kotlinx-serialization-json             = { group = "org.jetbrains.kotlinx",          name = "kotlinx-serialization-json",        version.ref = "kotlinx-serialization" }
material                               = { group = "com.google.android.material",   name = "material",                          version.ref = "material" }

[plugins]
android-application     = { id = "com.android.application",             version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt                    = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
google-services         = { id = "com.google.gms.google-services",      version = "4.4.2" }
